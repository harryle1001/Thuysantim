<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thủy Sản Tím — Loader</title>
<!--
  Màn hình chờ nhẹ (~4 KB, SVG + CSS, không cần JS). Nhịp theo φ: 0.382s · 0.618s · 1s · 1.618s.
  Dùng: copy khối .tst-loader + <style> vào layout, gỡ khi trang tải xong:
    window.addEventListener('load', () => document.querySelector('.tst-loader')?.classList.add('is-done'));
-->
<style>
  :root { --phi: 1.618034; }
  body { margin: 0; background: #12061f; }
  .tst-loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
    background: radial-gradient(ellipse 72% 62% at 50% 47%, #5b1263 0%, #3b0a3f 34%, #1e0b3a 66%, #0d0518 100%);
    transition: opacity .618s ease, visibility .618s; }
  .tst-loader.is-done { opacity: 0; visibility: hidden; }
  .tst-loader svg { width: min(38.2vw, 168px); height: auto; overflow: visible; display: block; margin: auto; }
  .tst-wave { fill: none; stroke: #f3d9ff; stroke-width: .8; transform-origin: 100px 100px; opacity: 0; animation: tst-wave 2.618s cubic-bezier(.2,.7,.3,1) infinite; }
  .tst-wave:nth-child(2) { animation-delay: .873s; } .tst-wave:nth-child(3) { animation-delay: 1.745s; }
  .tst-ring { fill: none; stroke: #fff; stroke-width: 7.739; stroke-dasharray: 101; stroke-dashoffset: 101;
    transform: rotate(-90deg); transform-origin: 100px 100px; animation: tst-draw 1s cubic-bezier(.65,0,.35,1) .382s forwards; }
  .tst-g { fill: #fff; opacity: 0; animation: tst-in .618s cubic-bezier(.2,.8,.3,1) forwards; }
  .tst-i { transform-origin: 100px 113px; animation-name: tst-grow; animation-delay: 1s; }
  .tst-l { --dx: 30px; animation-delay: 1.236s; } .tst-r { --dx: -32px; animation-delay: 1.236s; }
  .tst-t { --dy: 30px; animation-delay: 1.472s; } .tst-b { --dy: -32px; animation-delay: 1.472s; }
  .tst-name { margin-top: 26px; text-align: center; font: 600 clamp(16px, 4vw, 26px)/1 Montserrat, "Be Vietnam Pro", system-ui, sans-serif;
    letter-spacing: .14em; color: #fff; opacity: 0; animation: tst-fade .618s ease 1.854s forwards; }
  .tst-name b { font-weight: 600; background: linear-gradient(135deg, #f6e7bd, #d8b46c 60%, #a47a36); -webkit-background-clip: text; background-clip: text; color: transparent; }
  @keyframes tst-draw { to { stroke-dashoffset: 0; } }
  @keyframes tst-grow { from { opacity: 0; transform: scaleY(0); } to { opacity: 1; transform: none; } }
  @keyframes tst-in { from { opacity: 0; transform: translate(var(--dx, 0), var(--dy, 0)); } to { opacity: 1; transform: none; } }
  @keyframes tst-wave { 0% { opacity: .7; transform: scale(.4, .247); } 100% { opacity: 0; transform: scale(2.2, 1.36); } }
  @keyframes tst-fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .tst-loader * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; }
    .tst-wave { display: none; }
  }
</style>
</head>
<body>
<div class="tst-loader" role="status" aria-label="Đang tải Thủy Sản Tím">
  <div>
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <g><circle class="tst-wave" cx="100" cy="100" r="96"/><circle class="tst-wave" cx="100" cy="100" r="96"/><circle class="tst-wave" cx="100" cy="100" r="96"/></g>
      <circle class="tst-ring" cx="100" cy="100" r="92.13" pathLength="100"/>
      <path class="tst-g tst-i" d="M102.391 112.877L97.609 112.877L97.609 87.123L102.391 87.123L102.391 112.877Z"/>
      <path class="tst-g tst-l" d="M73.156 112.877L68.373 112.877L68.373 91.170L59.837 91.170L59.837 87.123L81.692 87.123L81.692 91.170L73.156 91.170L73.156 112.877Z"/>
      <path class="tst-g tst-r" d="M122.871 112.877L118.308 112.877L118.308 87.123L122.245 87.123L133.503 105.923L131.443 105.923L142.517 87.123L146.454 87.123L146.491 112.877L141.966 112.877L141.929 94.224L142.885 94.224L133.467 109.934L131.333 109.934L121.767 94.224L122.871 94.224L122.871 112.877Z"/>
      <path class="tst-g tst-t" d="M102.391 71.206L97.609 71.206L97.609 49.499L89.073 49.499L89.073 45.452L110.927 45.452L110.927 49.499L102.391 49.499L102.391 71.206Z"/>
      <path class="tst-g tst-b" d="M90.471 154.548L85.909 154.548L85.909 128.794L89.845 128.794L101.104 147.595L99.043 147.595L110.118 128.794L114.054 128.794L114.091 154.548L109.566 154.548L109.529 135.895L110.486 135.895L101.067 151.605L98.933 151.605L89.367 135.895L90.471 135.895L90.471 154.548Z"/>
    </svg>
    <div class="tst-name">THỦY SẢN <b>TÍM</b></div>
  </div>
</div>
</body>
</html>
