<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thủy Sản Tím — Loader</title>
<!--
  Màn hình chờ nhẹ (~5 KB, chỉ SVG + CSS, không JS bắt buộc).
  Dùng: copy khối <div class="tst-loader">…</div> + <style> vào layout,
  rồi gỡ khi trang tải xong:
    window.addEventListener('load', () => document.querySelector('.tst-loader')?.classList.add('is-done'));
-->
<style>
  body { margin: 0; background: #04162a; }
  .tst-loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
    background: radial-gradient(ellipse 70% 60% at 50% 48%, #0f5f9e 0%, #0a3a66 40%, #04162a 80%);
    transition: opacity .6s ease, visibility .6s; }
  .tst-loader.is-done { opacity: 0; visibility: hidden; }
  .tst-loader svg { width: min(34vw, 180px); height: auto; overflow: visible; }
  .tst-ring { fill: none; stroke: #d8b46c; stroke-width: .4; transform-origin: 32px 32px; opacity: 0;
    animation: tst-ring 2.4s cubic-bezier(.2,.7,.3,1) infinite; }
  .tst-ring:nth-child(2) { animation-delay: .8s; }
  .tst-ring:nth-child(3) { animation-delay: 1.6s; }
  .tst-draw { stroke-dasharray: 101; stroke-dashoffset: 101; animation: tst-draw 1.3s cubic-bezier(.65,0,.35,1) .1s forwards; }
  .tst-inner { stroke-dasharray: 101; stroke-dashoffset: 101; animation: tst-draw 1s cubic-bezier(.65,0,.35,1) .9s forwards; }
  .tst-fill { animation: tst-rise 1s cubic-bezier(.2,.7,.3,1) .6s both; }
  .tst-mark { opacity: 0; transform-origin: 32px 35px; animation: tst-pop .8s cubic-bezier(.2,.8,.3,1.2) 1.3s forwards; }
  .tst-sheen { animation: tst-sheen 2.6s ease-in-out 2s infinite; }
  .tst-name { margin-top: 22px; text-align: center; font: 700 clamp(18px, 4vw, 26px)/1 "Be Vietnam Pro", system-ui, sans-serif;
    letter-spacing: .14em; color: #fff; opacity: 0; animation: tst-fade .8s ease 1.7s forwards; }
  .tst-name b { background: linear-gradient(135deg, #f6e7bd, #d8b46c 60%, #a47a36); -webkit-background-clip: text; background-clip: text; color: transparent; }
  @keyframes tst-draw { to { stroke-dashoffset: 0; } }
  @keyframes tst-rise { from { transform: translateY(64px); } to { transform: none; } }
  @keyframes tst-pop { from { opacity: 0; transform: scale(.82) rotate(-25deg); } to { opacity: 1; transform: none; } }
  @keyframes tst-ring { 0% { opacity: .7; transform: scale(.6, .37); } 100% { opacity: 0; transform: scale(2.6, 1.6); } }
  @keyframes tst-sheen { 0% { transform: translate(-30px, -30px); } 45%, 100% { transform: translate(80px, 80px); } }
  @keyframes tst-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .tst-loader *, .tst-loader *::before { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; transform: none !important; }
    .tst-ring, .tst-sheen { display: none; }
  }
</style>
</head>
<body>
<div class="tst-loader" role="status" aria-label="Đang tải Thủy Sản Tím">
  <div>
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d98f"/><stop offset=".5" stop-color="#c9973f"/><stop offset="1" stop-color="#8a5a1c"/></linearGradient>
        <linearGradient id="ta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9c468"/><stop offset=".5" stop-color="#bd8a32"/><stop offset="1" stop-color="#7f5317"/></linearGradient>
        <linearGradient id="ts" x1="0" y1="0" x2="1" y2="1"><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff8e1" stop-opacity=".8"/><stop offset=".65" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <clipPath id="tc"><path d="M32 1.6 L57.6 9.4 C58.2 25.6 56.6 45 32 62.4 C7.4 45 5.8 25.6 6.4 9.4 Z"/></clipPath>
      </defs>
      <g><ellipse class="tst-ring" cx="32" cy="32" rx="30" ry="30"/><ellipse class="tst-ring" cx="32" cy="32" rx="30" ry="30"/><ellipse class="tst-ring" cx="32" cy="32" rx="30" ry="30"/></g>
      <g clip-path="url(#tc)"><rect class="tst-fill" x="0" y="0" width="64" height="64" fill="#f7fafd"/></g>
      <path class="tst-draw" pathLength="100" d="M32 1.6 L57.6 9.4 C58.2 25.6 56.6 45 32 62.4 C7.4 45 5.8 25.6 6.4 9.4 Z" fill="none" stroke="#0b2f52" stroke-width="3.6" stroke-linejoin="round"/>
      <path class="tst-draw" pathLength="100" d="M32 1.6 L57.6 9.4 C58.2 25.6 56.6 45 32 62.4 C7.4 45 5.8 25.6 6.4 9.4 Z" fill="none" stroke="url(#tg)" stroke-width="2.4" stroke-linejoin="round"/>
      <path class="tst-inner" pathLength="100" d="M32 4.5 L54.9 11.5 C55.3 25.8 53.9 43.2 32 59 C10.1 43.2 8.7 25.8 9.1 11.5 Z" fill="none" stroke="url(#tg)" stroke-width=".7"/>
      <g class="tst-mark"><g transform="translate(32 35) scale(.9) translate(-32 -33)">
        <g fill="none" stroke="url(#ta)" stroke-linecap="round" stroke-width="1"><path d="M38.72 20.93 C 37.72 12.93, 34 8.5, 20 12"/><path d="M39.72 20.53 C 42.72 12.93, 40 6.5, 29 8.1"/></g>
        <path d="M21.89 24.4 L21.89 21.4 L23.15 19.35 L23.3 21.75 Z M21.89 24.4 L23.3 21.75 L25.37 20.54 L24.38 22.72 Z M21.89 24.4 L24.38 22.72 L26.78 22.62 L24.88 24.09 Z" fill="url(#ta)"/>
        <path d="M45.24 23.16 C49.5 29 49.6 38 45.2 43 C40 49.3 31 51 23.7 46.6 C16.2 42 14.6 30.6 21.15 23.73 L22.64 25.07 C17.6 30.6 18.9 39.8 25 43.4 C30.8 46.8 38 45.5 41.3 39.2 C43.6 35 43.2 30.4 40.2 27.1 Z" fill="url(#ta)"/>
        <path d="M39.42 26.73 Q41.22 20.33 39.72 19.93 Q46.92 25.53 45.32 28.73 Z" fill="url(#ta)"/>
        <path d="M47.27 40.05 Q44.44 37.97 41.73 37.67 M41.53 46.81 Q40.27 43.98 38.31 42.31 M33.24 49.55 Q33.59 46.95 32.85 44.57 M24.87 47.62 Q26.33 46.04 26.87 43.65 M18.82 41.74 Q20.6 41.49 22.11 39.68" fill="none" stroke="#0b2f52" stroke-width=".55" opacity=".75"/>
        <circle cx="44.27" cy="25.22" r=".95" fill="#0b2f52"/>
        <g transform="matrix(-1 0 0 1 63.6 0)" fill="url(#tg)"><path d="M22.6 34.2 C 25.8 29.9, 32.6 29.7, 36.6 33.6 C 32.6 37.6, 25.8 37.6, 22.6 34.2 Z"/><path d="M36.3 33.6 L 41 30.5 Q 39.6 33.6 41 36.8 Z"/><path d="M28.4 30.7 Q 30.4 28 33.2 30.6 Z"/><circle cx="25.4" cy="33.6" r=".8" fill="#0b365c"/></g>
      </g></g>
      <g clip-path="url(#tc)"><rect class="tst-sheen" x="-20" y="-20" width="40" height="40" fill="url(#ts)"/></g>
    </svg>
    <div class="tst-name">THỦY SẢN <b>TÍM</b></div>
  </div>
</div>
</body>
</html>
