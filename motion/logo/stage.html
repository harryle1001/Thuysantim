<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thủy Sản Tím — Logo Reveal</title>
<style>
  @font-face { font-family: BVP; font-weight: 500; src: url(fonts/BeVietnamPro-500.ttf); }
  @font-face { font-family: BVP; font-weight: 700; src: url(fonts/BeVietnamPro-700.ttf); }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { position: relative; overflow: hidden; font-family: BVP, sans-serif; }
  #bg { position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 48%, #0f5f9e 0%, #0a3a66 38%, #04162a 78%); }
  #bg::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(2,10,20,.65) 100%); }
  .alpha #bg, .alpha #dust { display: none; }
  #fx, #dust { position: absolute; inset: 0; }
  #logo { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: visible; }
  #text { position: absolute; left: 0; top: 0; white-space: nowrap; }
  #title { font-weight: 700; color: #fff; line-height: 1; letter-spacing: .02em; }
  #title span { display: inline-block; will-change: transform, opacity, filter; }
  #title .gold { background: linear-gradient(135deg, #f6e7bd 0%, #e7cd8a 35%, #d8b46c 60%, #a47a36 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #rule { height: 2px; background: linear-gradient(90deg, transparent, #d8b46c 20%, #f6e7bd 50%, #d8b46c 80%, transparent); transform-origin: 50% 50%; }
  #tag { font-weight: 500; color: #c9d6e6; line-height: 1.35; }
  #tag div { white-space: nowrap; }
  #sheenText { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <svg id="dust"></svg>
  <svg id="fx"></svg>

  <svg id="logo" viewBox="0 0 64 64" width="64" height="64" shape-rendering="geometricPrecision">
    <defs>
      <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d98f"/><stop offset=".5" stop-color="#c9973f"/><stop offset="1" stop-color="#8a5a1c"/></linearGradient>
      <linearGradient id="ka" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9c468"/><stop offset=".5" stop-color="#bd8a32"/><stop offset="1" stop-color="#7f5317"/></linearGradient>
      <linearGradient id="kb" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f4f8fc"/></linearGradient>
      <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-20" y1="0" x2="0" y2="20">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff8e1" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <clipPath id="shieldClip"><path d="M32 1.6 L57.6 9.4 C58.2 25.6 56.6 45 32 62.4 C7.4 45 5.8 25.6 6.4 9.4 Z"/></clipPath>
      <clipPath id="waveClip"><path id="wavePath" d=""/></clipPath>
      <mask id="shrimpMask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
        <path id="sweep" d="M 31.754 23.546 A 12 12 0 0 1 33.846 47.454 A 12 12 0 0 1 31.546 23.566" fill="none" stroke="#fff" stroke-width="22"/>
      </mask>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
    </defs>
    <g id="shieldGlow" filter="url(#glow)" opacity="0">
      <path d="M32 1.6 L57.6 9.4 C58.2 25.6 56.6 45 32 62.4 C7.4 45 5.8 25.6 6.4 9.4 Z" fill="none" stroke="#f6e7bd" stroke-width="2.4"/>
    </g>
    <g clip-path="url(#waveClip)">
      <path d="M32 1.6 L57.6 9.4 C58.2 25.6 56.6 45 32 62.4 C7.4 45 5.8 25.6 6.4 9.4 Z" fill="url(#kb)"/>
    </g>
    <path id="outerDark" class="draw" d="M32 1.6 L57.6 9.4 C58.2 25.6 56.6 45 32 62.4 C7.4 45 5.8 25.6 6.4 9.4 Z" fill="none" stroke="#0b2f52" stroke-width="3.6" stroke-linejoin="round"/>
    <path id="outerGold" class="draw" d="M32 1.6 L57.6 9.4 C58.2 25.6 56.6 45 32 62.4 C7.4 45 5.8 25.6 6.4 9.4 Z" fill="none" stroke="url(#kg)" stroke-width="2.4" stroke-linejoin="round"/>
    <path id="innerGold" class="draw" d="M32 4.5 L54.9 11.5 C55.3 25.8 53.9 43.2 32 59 C10.1 43.2 8.7 25.8 9.1 11.5 Z" fill="none" stroke="url(#kg)" stroke-width=".7" stroke-linejoin="round"/>

    <g transform="translate(32 35) scale(.9) translate(-32 -33)">
      <g fill="none" stroke="url(#ka)" stroke-linecap="round" stroke-width="1">
        <path id="ant1" class="draw" d="M38.72 20.93 C 37.72 12.93, 34 8.5, 20 12"/>
        <path id="ant2" class="draw" d="M39.72 20.53 C 42.72 12.93, 40 6.5, 29 8.1"/>
      </g>
      <g mask="url(#shrimpMask)">
        <path id="legs" d="M42.65 34.17 L40.06 33.16 M41.45 38.87 L39.58 36.81 M38.26 42.64 L37.5 39.96 M33.65 44.68 L34.16 41.93 M28.51 44.49 L30.2 42.25" fill="none" stroke="url(#ka)" stroke-width=".8" stroke-linecap="round" opacity=".85"/>
        <path d="M45.24 23.16 L45.97 24.2 L46.61 25.29 L47.16 26.43 L47.63 27.61 L48 28.81 L48.28 30.04 L48.47 31.28 L48.56 32.54 L48.55 33.79 L48.45 35.04 L48.25 36.27 L47.97 37.48 L47.59 38.67 L47.12 39.82 L46.57 40.92 L45.94 41.99 L45.23 42.99 L44.45 43.94 L43.6 44.83 L42.68 45.65 L41.71 46.39 L40.69 47.06 L39.63 47.64 L38.52 48.15 L37.38 48.56 L36.22 48.89 L35.04 49.13 L33.84 49.28 L32.65 49.33 L31.45 49.3 L30.26 49.17 L29.09 48.96 L27.94 48.66 L26.82 48.27 L25.73 47.8 L24.69 47.25 L23.69 46.63 L22.74 45.93 L21.86 45.17 L21.03 44.34 L20.28 43.45 L19.59 42.52 L18.98 41.53 L18.44 40.51 L17.99 39.45 L17.62 38.36 L17.33 37.25 L17.13 36.12 L17.02 34.99 L16.99 33.85 L17.05 32.72 L17.19 31.59 L17.42 30.49 L17.72 29.41 L18.11 28.35 L18.58 27.34 L19.12 26.36 L19.73 25.43 L20.41 24.55 L21.15 23.73 L22.64 25.07 L22.06 25.83 L21.54 26.62 L21.09 27.45 L20.7 28.31 L20.38 29.19 L20.13 30.1 L19.95 31.01 L19.83 31.93 L19.79 32.86 L19.82 33.78 L19.92 34.7 L20.08 35.6 L20.31 36.49 L20.61 37.35 L20.97 38.18 L21.39 38.98 L21.87 39.75 L22.41 40.47 L22.99 41.15 L23.62 41.78 L24.3 42.36 L25.01 42.89 L25.76 43.35 L26.54 43.76 L27.35 44.11 L28.18 44.39 L29.02 44.61 L29.88 44.77 L30.74 44.86 L31.6 44.88 L32.46 44.84 L33.31 44.74 L34.15 44.57 L34.97 44.34 L35.77 44.05 L36.54 43.7 L37.28 43.3 L37.99 42.84 L38.65 42.33 L39.28 41.78 L39.86 41.18 L40.39 40.54 L40.87 39.86 L41.29 39.16 L41.66 38.42 L41.98 37.67 L42.23 36.89 L42.43 36.1 L42.56 35.3 L42.63 34.49 L42.65 33.69 L42.6 32.88 L42.49 32.09 L42.33 31.31 L42.1 30.54 L41.82 29.8 L41.49 29.08 L41.1 28.38 L40.67 27.72 L40.2 27.1 Z" fill="url(#ka)"/>
        <path d="M39.42 26.73 Q41.22 20.33 39.72 19.93 Q46.92 25.53 45.32 28.73 Z" fill="url(#ka)"/>
        <path d="M47.27 40.05 Q44.44 37.97 41.73 37.67 M41.53 46.81 Q40.27 43.98 38.31 42.31 M33.24 49.55 Q33.59 46.95 32.85 44.57 M24.87 47.62 Q26.33 46.04 26.87 43.65 M18.82 41.74 Q20.6 41.49 22.11 39.68 M16.75 33.71 Q18.05 34.64 20.05 33.67" fill="none" stroke="#0b2f52" stroke-width=".55" opacity=".75"/>
      </g>
      <path id="tail" d="M21.89 24.4 L21.89 21.4 L23.15 19.35 L23.3 21.75 Z M21.89 24.4 L23.3 21.75 L25.37 20.54 L24.38 22.72 Z M21.89 24.4 L24.38 22.72 L26.78 22.62 L24.88 24.09 Z" fill="url(#ka)" style="transform-box: fill-box; transform-origin: 0% 100%"/>
      <circle id="eye" cx="44.27" cy="25.22" r=".95" fill="#0b2f52" style="transform-box: fill-box; transform-origin: center"/>
      <g id="fish">
        <g transform="matrix(-1 0 0 1 63.6 0)">
          <g fill="url(#kg)">
            <path d="M22.6 34.2 C 25.8 29.9, 32.6 29.7, 36.6 33.6 C 32.6 37.6, 25.8 37.6, 22.6 34.2 Z"/>
            <path id="fishTail" d="M36.3 33.6 L 41 30.5 Q 39.6 33.6 41 36.8 Z"/>
            <path d="M28.4 30.7 Q 30.4 28 33.2 30.6 Z" opacity=".9"/>
            <path d="M29.4 36.7 Q 30.6 38.8 32.6 37 Z" opacity=".8"/>
          </g>
          <circle cx="25.4" cy="33.6" r=".8" fill="#0b365c"/>
          <path d="M27.7 32 q1.1 2.1 0 4.2" stroke="#0b365c" stroke-width=".5" fill="none" opacity=".6"/>
        </g>
      </g>
    </g>
    <g clip-path="url(#shieldClip)"><rect id="sheenRect" x="-40" y="-40" width="144" height="144" fill="url(#sheen)" opacity="0"/></g>
  </svg>

  <div id="text">
    <div id="title"></div>
    <div id="rule"></div>
    <div id="tag"></div>
  </div>
</div>

<script>
const Q = new URLSearchParams(location.search);
const O = Q.get('o') === 'v' ? 'v' : 'h';
const W = O === 'h' ? 1920 : 1080, H = O === 'h' ? 1080 : 1920;
const DUR = 6.0;
if (Q.get('alpha') === '1') document.documentElement.classList.add('alpha');
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
for (const s of ['dust', 'fx']) { $(s).setAttribute('width', W); $(s).setAttribute('height', H); $(s).setAttribute('viewBox', `0 0 ${W} ${H}`); }

// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut3 = x => 1 - Math.pow(1 - x, 3);
const eOut5 = x => 1 - Math.pow(1 - x, 5);
const eIO3 = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutBack = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;

// ---------- text build ----------
const titleEl = $('title'), tagEl = $('tag'), ruleEl = $('rule');
const TITLE = [['THỦY SẢN ', ''], ['TÍM', 'gold']];
const letters = [];
for (const [txt, cls] of TITLE) for (const ch of txt) {
  const s = document.createElement('span'); s.textContent = ch === ' ' ? ' ' : ch; if (cls) s.className = cls;
  titleEl.appendChild(s); letters.push(s);
}
const TAG = O === 'h' ? ['TINH HOA SINH HỌC · VỮNG VÀNG MÙA VỤ'] : ['TINH HOA SINH HỌC', 'VỮNG VÀNG MÙA VỤ'];
for (const line of TAG) { const d = document.createElement('div'); d.textContent = line; tagEl.appendChild(d); }

// ---------- layout ----------
const L = {};
function layout() {
  const textEl = $('text');
  if (O === 'h') {
    L.logoStart = 470; L.logoEnd = 330;
    titleEl.style.fontSize = '132px'; tagEl.style.fontSize = '33px'; tagEl.style.letterSpacing = '.2em';
    ruleEl.style.margin = '34px 0 30px'; tagEl.style.textAlign = 'left';
  } else {
    L.logoStart = 640; L.logoEnd = 560;
    titleEl.style.fontSize = '134px'; tagEl.style.fontSize = '40px'; tagEl.style.letterSpacing = '.22em';
    ruleEl.style.margin = '40px auto 36px'; tagEl.style.textAlign = 'center'; titleEl.style.textAlign = 'center';
  }
  const tw = textEl.offsetWidth, th = textEl.offsetHeight;
  ruleEl.style.width = (O === 'h' ? titleEl.offsetWidth : titleEl.offsetWidth * .5) + 'px';
  L.tw = tw; L.th = th;
  // logo center positions (shield visual centre ≈ (32,32) of 64)
  L.start = { x: W / 2, y: H / 2 };
  if (O === 'h') {
    const lw = L.logoEnd * 52 / 64, gap = 96, total = lw + gap + tw;
    const x0 = (W - total) / 2;
    L.end = { x: x0 + lw / 2, y: H / 2 };
    L.textPos = { x: x0 + lw + gap, y: H / 2 - th / 2 + 6 };
  } else {
    const gap = 90, total = L.logoEnd + gap + th;
    const y0 = (H - total) / 2;
    L.end = { x: W / 2, y: y0 + L.logoEnd / 2 };
    L.textPos = { x: (W - tw) / 2, y: y0 + L.logoEnd + gap };
  }
  textEl.style.left = L.textPos.x + 'px'; textEl.style.top = L.textPos.y + 'px';
}

// ---------- dust ----------
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const dust = [];
for (let i = 0; i < 46; i++) {
  const c = document.createElementNS(NS, 'circle');
  const d = { x: rnd() * W, y: rnd() * H, r: .8 + rnd() * 2.2, sp: 12 + rnd() * 30, ph: rnd() * 6.28, a: .25 + rnd() * .55, el: c };
  c.setAttribute('fill', rnd() > .3 ? '#e7cd8a' : '#9fd0ff'); $('dust').appendChild(c); dust.push(d);
}
// ---------- ripples ----------
const rings = [];
for (let i = 0; i < 4; i++) {
  const c = document.createElementNS(NS, 'ellipse'); c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#e7cd8a');
  $('fx').appendChild(c); rings.push(c);
}
const drop = document.createElementNS(NS, 'circle'); drop.setAttribute('fill', '#fff4d6'); $('fx').appendChild(drop);
const dropHalo = document.createElementNS(NS, 'circle'); dropHalo.setAttribute('fill', 'url(#halo)'); $('fx').prepend(dropHalo);
$('fx').insertAdjacentHTML('afterbegin', '<defs><radialGradient id="halo"><stop offset="0" stop-color="#f6e7bd" stop-opacity=".9"/><stop offset=".35" stop-color="#d8b46c" stop-opacity=".35"/><stop offset="1" stop-color="#d8b46c" stop-opacity="0"/></radialGradient></defs>');

// ---------- path lengths ----------
const drawEls = [...document.querySelectorAll('.draw')];
for (const p of drawEls) { const l = p.getTotalLength(); p.dataset.len = l; p.style.strokeDasharray = l + ' ' + l; }
const sweep = $('sweep'); const sweepLen = sweep.getTotalLength();
sweep.style.strokeDasharray = sweepLen + ' ' + sweepLen;
function setDraw(p, k) { p.style.strokeDashoffset = (1 - k) * +p.dataset.len; p.style.opacity = k > 0 ? 1 : 0; }

function wave(level, amp, t) {
  let d = `M -2 ${level}`;
  for (let x = -2; x <= 66; x += 1.5) d += ` L ${x} ${level + Math.sin(x * .32 + t * 9) * amp + Math.sin(x * .17 - t * 5) * amp * .5}`;
  return d + ' L 66 70 L -2 70 Z';
}

// ---------- render ----------
window.renderAt = function (t) {
  // dust
  for (const d of dust) {
    const y = ((d.y - d.sp * t) % H + H) % H;
    d.el.setAttribute('cx', d.x + Math.sin(t * .8 + d.ph) * 10); d.el.setAttribute('cy', y); d.el.setAttribute('r', d.r);
    d.el.setAttribute('opacity', d.a * eOut3(prog(t, 0, 1.2)) * (.6 + .4 * Math.sin(t * 2.2 + d.ph)));
  }
  $('bg').style.opacity = eOut3(prog(t, 0, .5));

  // logo transform
  const mv = eIO3(prog(t, 3.45, 4.55));
  const size = lerp(L.logoStart, L.logoEnd, mv);
  const breathe = 1 + .035 * (1 - eOut3(prog(t, .5, 3.4)));   // gentle settle while drawing
  const s = size * breathe;
  const cx = lerp(L.start.x, L.end.x, mv), cy = lerp(L.start.y, L.end.y, mv);
  $('logo').style.width = s + 'px'; $('logo').style.height = s + 'px';
  $('logo').style.transform = `translate(${cx - s / 2}px, ${cy - s / 2}px)`;

  // drop + ripples (centred on start position, flattened like a water surface)
  const dk = prog(t, .12, .55);
  drop.setAttribute('cx', L.start.x); drop.setAttribute('cy', L.start.y);
  drop.setAttribute('r', 7 * eOutBack(dk) * (1 - eOut3(prog(t, .55, .9))));
  dropHalo.setAttribute('cx', L.start.x); dropHalo.setAttribute('cy', L.start.y);
  dropHalo.setAttribute('r', 160 * eOut3(dk)); dropHalo.setAttribute('opacity', (1 - eOut3(prog(t, .5, 1.6))) * dk);
  rings.forEach((r, i) => {
    const k = prog(t, .45 + i * .22, 2.4 + i * .22), e = eOut3(k);
    const R = 40 + e * (O === 'h' ? 900 : 760);
    r.setAttribute('cx', L.start.x); r.setAttribute('cy', L.start.y);
    r.setAttribute('rx', R); r.setAttribute('ry', R * .62);
    r.setAttribute('stroke-width', 2.2 - e * 1.6);
    r.setAttribute('opacity', k > 0 ? (1 - k) * (.75 - i * .14) : 0);
  });

  // shield strokes
  setDraw($('outerDark'), eIO3(prog(t, .5, 1.7)));
  setDraw($('outerGold'), eIO3(prog(t, .5, 1.7)));
  setDraw($('innerGold'), eIO3(prog(t, 1.85, 2.55)));
  $('shieldGlow').setAttribute('opacity', .9 * Math.sin(Math.PI * prog(t, 1.1, 2.1)));

  // water fill rising
  const fk = prog(t, 1.25, 2.3);
  const level = lerp(66, -3, eOut3(fk));
  $('wavePath').setAttribute('d', wave(level, 1.6 * (1 - fk) + .0001, t));

  // shrimp
  sweep.style.strokeDashoffset = (1 - eIO3(prog(t, 2.05, 3.05))) * sweepLen;
  setDraw($('ant1'), eOut3(prog(t, 2.55, 3.35)));
  setDraw($('ant2'), eOut3(prog(t, 2.65, 3.45)));
  const tk = prog(t, 2.85, 3.3);
  $('tail').style.opacity = tk; $('tail').style.transform = `scale(${lerp(.4, 1, eOutBack(tk))})`;
  const ek = prog(t, 2.95, 3.25);
  $('eye').style.opacity = ek; $('eye').style.transform = `scale(${eOutBack(ek)})`;

  // fish swims in from the left
  const fsk = prog(t, 2.75, 3.6);
  $('fish').setAttribute('opacity', eOut3(fsk));
  $('fish').setAttribute('transform', `translate(${-9 * (1 - eOut5(fsk))} ${Math.sin(fsk * 6.28) * .5 * (1 - fsk)})`);
  $('fishTail').setAttribute('transform', `rotate(${Math.sin(t * 22) * 9 * (1 - fsk)} 36.3 33.6)`);

  // sheen across shield
  const sk = prog(t, 3.35, 4.15);
  $('sheenRect').setAttribute('opacity', sk > 0 && sk < 1 ? 1 : 0);
  $('sheenRect').setAttribute('transform', `translate(${lerp(-10, 90, eIO3(sk))} ${lerp(-10, 90, eIO3(sk))})`);

  // title letters
  letters.forEach((el, i) => {
    const k = prog(t, 3.85 + i * .045, 4.55 + i * .045), e = eOut3(k);
    el.style.opacity = e;
    el.style.transform = `translateY(${(1 - e) * 46}px)`;
    el.style.filter = `blur(${(1 - e) * 14}px)`;
  });
  // shimmer on TÍM
  const gk = prog(t, 5.0, 5.7);
  for (const el of letters) if (el.classList.contains('gold')) {
    el.style.backgroundImage = `linear-gradient(110deg, #d8b46c 0%, #f6e7bd 30%, #d8b46c 45%, ${gk > 0 && gk < 1 ? '#fffaf0' : '#e7cd8a'} ${lerp(-20, 120, gk)}%, #d8b46c ${lerp(-20, 120, gk) + 12}%, #a47a36 100%)`;
    el.style.backgroundSize = 'auto';
  }
  // rule + tagline
  const rk = eIO3(prog(t, 4.45, 5.2));
  ruleEl.style.transform = `scaleX(${rk})`; ruleEl.style.opacity = rk;
  ruleEl.style.transformOrigin = O === 'h' ? '0 50%' : '50% 50%';
  const tg = eOut3(prog(t, 4.65, 5.45));
  tagEl.style.opacity = tg; tagEl.style.transform = `translateY(${(1 - tg) * 14}px)`;
};

window.ready = document.fonts.ready.then(() => { layout(); window.renderAt(0); return { W, H, DUR }; });
if (Q.get('play') === '1') window.ready.then(() => { const t0 = performance.now(); (function f() { const t = ((performance.now() - t0) / 1000) % (DUR + 1); window.renderAt(Math.min(t, DUR)); requestAnimationFrame(f); })(); });
</script>
</body>
</html>
