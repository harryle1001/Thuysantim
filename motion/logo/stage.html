<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thủy Sản Tím — Logo Reveal</title>
<style>
  @font-face { font-family: MS; font-weight: 500; src: url(fonts/Montserrat-500.ttf); }
  @font-face { font-family: MS; font-weight: 600; src: url(fonts/Montserrat-600.ttf); }
  :root { --phi: 1.618034; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { position: relative; overflow: hidden; font-family: MS, sans-serif; }
  #bg { position: absolute; inset: 0;
    background: radial-gradient(ellipse 72% 62% at 50% 47%, #5b1263 0%, #3b0a3f 34%, #1e0b3a 66%, #0d0518 100%); }
  .alpha #bg, .alpha #dust { display: none; }
  #fx, #dust { position: absolute; inset: 0; }
  #logo { position: absolute; left: 0; top: 0; overflow: visible; }
  #text { position: absolute; left: 0; top: 0; white-space: nowrap; }
  #title { font-weight: 600; color: #fff; line-height: 1; letter-spacing: .06em; }
  #title span { display: inline-block; }
  #title .gold { background: linear-gradient(135deg, #f6e7bd 0%, #e7cd8a 40%, #d8b46c 70%, #a47a36 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #rule { height: 2px; background: linear-gradient(90deg, transparent, #d8b46c 20%, #f6e7bd 50%, #d8b46c 80%, transparent); }
  #tag { font-weight: 500; color: #e9d5f0; line-height: 1.618; }
  #tag div { white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <svg id="dust"></svg>
  <svg id="fx"></svg>
  <svg id="logo" viewBox="0 0 200 200" width="200" height="200">
    <defs>
      <linearGradient id="wg" gradientUnits="userSpaceOnUse" x1="28" y1="28" x2="172" y2="172">
        <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#fbf3ff"/><stop offset="1" stop-color="#eedcf5"/></linearGradient>
      <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-60" y1="0" x2="0" y2="60">
        <stop offset="0" stop-color="#f6e7bd" stop-opacity="0"/><stop offset=".5" stop-color="#fff6dc" stop-opacity="1"/><stop offset="1" stop-color="#f6e7bd" stop-opacity="0"/></linearGradient>
      <mask id="logoMask" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><g id="maskCopy" fill="#fff"></g></mask>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    </defs>
    <circle id="ringGlow" cx="100" cy="100" r="92.13" fill="none" stroke="#f0c8ff" stroke-width="10" filter="url(#glow)" opacity="0"/>
    <circle id="ring" cx="100" cy="100" r="92.13" fill="none" stroke="url(#wg)" stroke-width="7.739" transform="rotate(-90 100 100)"/>
    <g id="letters" fill="url(#wg)"></g>
    <g mask="url(#logoMask)"><rect id="sheenRect" x="-120" y="-120" width="440" height="440" fill="url(#sheen)" opacity="0"/></g>
  </svg>
  <div id="text"><div id="title"></div><div id="rule"></div><div id="tag"></div></div>
</div>

<script>
const PHI = 1.618034;
const Q = new URLSearchParams(location.search);
const O = Q.get('o') === 'v' ? 'v' : 'h';
const W = O === 'h' ? 1920 : 1080, H = O === 'h' ? 1080 : 1920;
const DUR = 6.18;                       // ≈ φ·φ·φ·φ·0.9 — kết thúc khớp nhịp φ
if (Q.get('alpha') === '1') document.documentElement.classList.add('alpha');
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
$('stage').style.width = W + 'px'; $('stage').style.height = H + 'px';
for (const s of ['dust', 'fx']) { $(s).setAttribute('width', W); $(s).setAttribute('height', H); $(s).setAttribute('viewBox', `0 0 ${W} ${H}`); }

// ---- logo glyphs (từ public/brand/logo-tim-4k/svg/logo-tim.svg) ----
const G = {
  I:  'M102.391 112.877L97.609 112.877L97.609 87.123L102.391 87.123L102.391 112.877Z',
  Tl: 'M73.156 112.877L68.373 112.877L68.373 91.170L59.837 91.170L59.837 87.123L81.692 87.123L81.692 91.170L73.156 91.170L73.156 112.877Z',
  Mr: 'M122.871 112.877L118.308 112.877L118.308 87.123L122.245 87.123L133.503 105.923L131.443 105.923L142.517 87.123L146.454 87.123L146.491 112.877L141.966 112.877L141.929 94.224L142.885 94.224L133.467 109.934L131.333 109.934L121.767 94.224L122.871 94.224L122.871 112.877Z',
  Tt: 'M102.391 71.206L97.609 71.206L97.609 49.499L89.073 49.499L89.073 45.452L110.927 45.452L110.927 49.499L102.391 49.499L102.391 71.206Z',
  Mb: 'M90.471 154.548L85.909 154.548L85.909 128.794L89.845 128.794L101.104 147.595L99.043 147.595L110.118 128.794L114.054 128.794L114.091 154.548L109.566 154.548L109.529 135.895L110.486 135.895L101.067 151.605L98.933 151.605L89.367 135.895L90.471 135.895L90.471 154.548Z',
};
const glyph = {};
for (const k in G) {
  const p = document.createElementNS(NS, 'path'); p.setAttribute('d', G[k]); $('letters').appendChild(p); glyph[k] = p;
  const m = document.createElementNS(NS, 'path'); m.setAttribute('d', G[k]); $('maskCopy').appendChild(m);
}
$('maskCopy').insertAdjacentHTML('afterbegin', '<path d="M4 100a96 96 0 1 0 192 0a96 96 0 1 0 -192 0Z M11.74 100a88.26 88.26 0 1 0 176.52 0a88.26 88.26 0 1 0 -176.52 0Z" fill-rule="evenodd"/>');

// ---- easing ----
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut3 = x => 1 - Math.pow(1 - x, 3);
const eOut5 = x => 1 - Math.pow(1 - x, 5);
const eIO3 = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutBack = x => { const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;

// ---- text ----
const titleEl = $('title'), tagEl = $('tag'), ruleEl = $('rule');
const letters = [];
for (const [txt, cls] of [['THỦY SẢN ', ''], ['TÍM', 'gold']]) for (const ch of txt) {
  const s = document.createElement('span'); s.textContent = ch === ' ' ? ' ' : ch; if (cls) s.className = cls;
  titleEl.appendChild(s); letters.push(s);
}
for (const line of (O === 'h' ? ['TINH HOA SINH HỌC · VỮNG VÀNG MÙA VỤ'] : ['TINH HOA SINH HỌC', 'VỮNG VÀNG MÙA VỤ'])) {
  const d = document.createElement('div'); d.textContent = line; tagEl.appendChild(d);
}

// ---- layout (thang φ) ----
const L = {};
function layout() {
  if (O === 'h') {
    L.logoStart = 550; L.logoEnd = 340;                 // 550/340 ≈ φ
    titleEl.style.fontSize = '120px'; tagEl.style.fontSize = '28px'; tagEl.style.letterSpacing = '.236em';
    ruleEl.style.margin = '42px 0 26px';
  } else {
    L.logoStart = 680; L.logoEnd = 420;                 // 680/420 ≈ φ
    titleEl.style.fontSize = '96px'; tagEl.style.fontSize = '36px'; tagEl.style.letterSpacing = '.236em';
    ruleEl.style.margin = '42px auto 42px'; tagEl.style.textAlign = 'center'; titleEl.style.textAlign = 'center';
  }
  ruleEl.style.width = (O === 'h' ? titleEl.offsetWidth : titleEl.offsetWidth * .382) + 'px';
  const tw = $('text').offsetWidth, th = $('text').offsetHeight;
  L.start = { x: W / 2, y: H / 2 };
  if (O === 'h') {
    const gap = 68, total = L.logoEnd + gap + tw, x0 = (W - total) / 2;
    L.end = { x: x0 + L.logoEnd / 2, y: H / 2 };
    L.textPos = { x: x0 + L.logoEnd + gap, y: H / 2 - th / 2 };
  } else {
    const gap = 110, total = L.logoEnd + gap + th, y0 = (H - total) / 2;
    L.end = { x: W / 2, y: y0 + L.logoEnd / 2 };
    L.textPos = { x: (W - tw) / 2, y: y0 + L.logoEnd + gap };
  }
  $('text').style.left = L.textPos.x + 'px'; $('text').style.top = L.textPos.y + 'px';
}

// ---- dust (bụi sáng / hạt nước) ----
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const dust = [];
for (let i = 0; i < 55; i++) {
  const c = document.createElementNS(NS, 'circle');
  dust.push({ x: rnd() * W, y: rnd() * H, r: .7 + rnd() * 2, sp: 10 + rnd() * 26, ph: rnd() * 6.28, a: .2 + rnd() * .5, el: c });
  c.setAttribute('fill', rnd() > .4 ? '#f3d9ff' : '#e7cd8a'); $('dust').appendChild(c);
}
// ---- drop + ripples ----
$('fx').innerHTML = '<defs><radialGradient id="halo"><stop offset="0" stop-color="#fbe8ff" stop-opacity=".9"/><stop offset=".35" stop-color="#d98ef0" stop-opacity=".35"/><stop offset="1" stop-color="#86198f" stop-opacity="0"/></radialGradient>' +
  '<linearGradient id="dropG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>';
const halo = document.createElementNS(NS, 'circle'); halo.setAttribute('fill', 'url(#halo)'); $('fx').appendChild(halo);
const trail = document.createElementNS(NS, 'rect'); trail.setAttribute('fill', 'url(#dropG)'); $('fx').appendChild(trail);
const drop = document.createElementNS(NS, 'circle'); drop.setAttribute('fill', '#fff'); $('fx').appendChild(drop);
const rings = [];
for (let i = 0; i < 4; i++) { const e = document.createElementNS(NS, 'ellipse'); e.setAttribute('fill', 'none'); e.setAttribute('stroke', '#f3d9ff'); $('fx').appendChild(e); rings.push(e); }

const ring = $('ring'); const ringLen = 2 * Math.PI * 92.13;
ring.style.strokeDasharray = ringLen + ' ' + ringLen;

// ---- timeline (mốc theo φ: 0.382 · 0.618 · 1 · 1.618 · 2.618 · 4.236) ----
window.renderAt = function (t) {
  $('bg').style.opacity = eOut3(prog(t, 0, .618));
  for (const d of dust) {
    const y = ((d.y - d.sp * t) % H + H) % H;
    d.el.setAttribute('cx', d.x + Math.sin(t * .7 + d.ph) * 12); d.el.setAttribute('cy', y); d.el.setAttribute('r', d.r);
    d.el.setAttribute('opacity', d.a * eOut3(prog(t, 0, 1.2)) * (.6 + .4 * Math.sin(t * 2 + d.ph)));
  }

  // giọt nước rơi 0.236 → 0.618, chạm mặt nước
  const cx0 = L.start.x, cy0 = L.start.y;
  const fk = prog(t, .236, .618), fall = fk * fk;
  const dy = lerp(-H * .55, 0, fall);
  drop.setAttribute('cx', cx0); drop.setAttribute('cy', cy0 + dy);
  drop.setAttribute('r', fk > 0 && fk < 1 ? 6 : 0);
  trail.setAttribute('x', cx0 - 2); trail.setAttribute('width', 4);
  trail.setAttribute('y', cy0 + dy - 160 * fk); trail.setAttribute('height', fk > 0 && fk < 1 ? 160 * fk : 0);
  trail.setAttribute('opacity', .55);
  const hk = prog(t, .618, 1.618);
  halo.setAttribute('cx', cx0); halo.setAttribute('cy', cy0);
  halo.setAttribute('r', 60 + 260 * eOut3(hk)); halo.setAttribute('opacity', hk > 0 ? (1 - eOut3(hk)) : 0);
  rings.forEach((r, i) => {
    const k = prog(t, .618 + i * .236, 2.618 + i * .236), e = eOut3(k);
    const R = 20 + e * (O === 'h' ? 1000 : 900);
    r.setAttribute('cx', cx0); r.setAttribute('cy', cy0); r.setAttribute('rx', R); r.setAttribute('ry', R * .618);
    r.setAttribute('stroke-width', 2.4 - e * 1.8); r.setAttribute('opacity', k > 0 ? (1 - k) * (.7 - i * .13) : 0);
  });

  // logo vị trí / kích thước
  const mv = eIO3(prog(t, 3.236, 4.236));
  const s = lerp(L.logoStart, L.logoEnd, mv) * (1 + .03 * (1 - eOut3(prog(t, .618, 3.2))));
  const cx = lerp(L.start.x, L.end.x, mv), cy = lerp(L.start.y, L.end.y, mv);
  const lg = $('logo'); lg.style.width = s + 'px'; lg.style.height = s + 'px';
  lg.style.transform = `translate(${cx - s / 2}px, ${cy - s / 2}px)`;

  // vòng tròn: gợn sóng thu lại thành vòng logo, nét vẽ quanh 0.618 → 1.618
  const rk = eIO3(prog(t, .618, 1.618));
  ring.style.strokeDashoffset = (1 - rk) * ringLen;
  ring.setAttribute('r', lerp(110, 92.13, eOut3(prog(t, .618, 1.618))));
  ring.style.opacity = prog(t, .618, .8);
  $('ringGlow').setAttribute('opacity', .8 * Math.sin(Math.PI * prog(t, 1.2, 2.2)));

  // chữ thập TIM: I mọc lên → T, M trượt ngang → T trên, M dưới
  const ik = eOut5(prog(t, 1.382, 1.9));
  glyph.I.setAttribute('transform', `translate(0 ${100 * (1 - ik)}) scale(1 ${ik})`); glyph.I.style.opacity = ik > 0 ? 1 : 0;
  const hk2 = eOut5(prog(t, 1.75, 2.45));
  glyph.Tl.setAttribute('transform', `translate(${30 * (1 - hk2)} 0)`); glyph.Tl.style.opacity = hk2;
  glyph.Mr.setAttribute('transform', `translate(${-32 * (1 - hk2)} 0)`); glyph.Mr.style.opacity = hk2;
  const vk = eOut5(prog(t, 2.1, 2.8));
  glyph.Tt.setAttribute('transform', `translate(0 ${30 * (1 - vk)})`); glyph.Tt.style.opacity = vk;
  glyph.Mb.setAttribute('transform', `translate(0 ${-32 * (1 - vk)})`); glyph.Mb.style.opacity = vk;

  // ánh champagne quét qua logo
  const sk = prog(t, 2.618, 3.4);
  $('sheenRect').setAttribute('opacity', sk > 0 && sk < 1 ? 1 : 0);
  $('sheenRect').setAttribute('transform', `translate(${lerp(-40, 300, eIO3(sk))} ${lerp(-40, 300, eIO3(sk))})`);

  // chữ THỦY SẢN TÍM
  letters.forEach((el, i) => {
    const k = prog(t, 3.618 + i * .0618, 4.236 + i * .0618), e = eOut3(k);
    el.style.opacity = e; el.style.transform = `translateY(${(1 - e) * 42}px)`; el.style.filter = `blur(${(1 - e) * 10}px)`;
  });
  const gk = prog(t, 5.0, 5.8), gp = lerp(-30, 130, gk);
  for (const el of letters) if (el.classList.contains('gold'))
    el.style.backgroundImage = `linear-gradient(110deg, #d8b46c 0%, #f6e7bd ${gp - 14}%, #fffaf0 ${gp}%, #f6e7bd ${gp + 14}%, #a47a36 100%)`;
  const rlk = eIO3(prog(t, 4.236, 5.0));
  ruleEl.style.transform = `scaleX(${rlk})`; ruleEl.style.opacity = rlk; ruleEl.style.transformOrigin = O === 'h' ? '0 50%' : '50% 50%';
  const tg = eOut3(prog(t, 4.5, 5.236));
  tagEl.style.opacity = tg; tagEl.style.transform = `translateY(${(1 - tg) * 16}px)`;
};

window.ready = document.fonts.ready.then(() => { layout(); window.renderAt(0); return { W, H, DUR }; });
if (Q.get('play') === '1') window.ready.then(() => { const t0 = performance.now(); (function f() { const t = ((performance.now() - t0) / 1000) % (DUR + 1); window.renderAt(Math.min(t, DUR)); requestAnimationFrame(f); })(); });
</script>
</body>
</html>
