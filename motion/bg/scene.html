<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thủy Sản Tím — Background quảng cáo</title>
<style>
  @font-face { font-family: MS; font-weight: 500; src: url(../logo/fonts/Montserrat-500.ttf); }
  @font-face { font-family: MS; font-weight: 600; src: url(../logo/fonts/Montserrat-600.ttf); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Mưa nắng trên ao nuôi lúc hoàng hôn tím: nắng – mưa – gió – nước.
   Mọi chuyển động tuần hoàn theo LOOP giây → video lặp liền mạch.
   Bố cục theo φ: đường chân trời ở 61.8% chiều cao, mặt trời ở 61.8% chiều ngang. */
const PHI = 1.618034, TAU = Math.PI * 2;
const Q = new URLSearchParams(location.search);
const O = Q.get('o') === 'v' ? 'v' : 'h';
const W = O === 'h' ? 1920 : 1080, H = O === 'h' ? 1080 : 1920;
const LOOP = 10, SHOW_LOGO = Q.get('logo') !== '0';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DPR = +(Q.get('dpr') || 1);
cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';

let seed = 1618; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const HZ = H * (O === 'h' ? .618 : .58);            // đường chân trời
const SUN = { x: W * .618, y: HZ - H * (O === 'h' ? .09 : .07), r: O === 'h' ? 62 : 70 };
const WIND = .32;                                     // độ nghiêng mưa theo gió (dx/dy)

// ---------- dữ liệu ngẫu nhiên cố định ----------
const rain = [];
for (let L = 0; L < 3; L++) {
  const n = [140, 110, 60][L];
  for (let i = 0; i < n; i++) rain.push({ L, x: rnd() * (W + H * WIND), y: rnd(), k: [3, 4, 6][L] + Math.floor(rnd() * 2),
    len: [16, 28, 48][L] * (.7 + rnd() * .6), a: [.18, .28, .42][L] * (.6 + rnd() * .4), w: [.8, 1.2, 1.8][L] });
}
const clouds = [];
for (let i = 0; i < 9; i++) clouds.push({ y: HZ * (.08 + rnd() * .6), w: W * (.25 + rnd() * .35), h: 40 + rnd() * 90,
  x: rnd(), n: 1 + Math.floor(rnd() * 2), a: .1 + rnd() * .16 });
const ripples = [];
for (let i = 0; i < 46; i++) { const d = rnd(); ripples.push({ x: rnd() * W, d, s: rnd() * LOOP, life: 1.2 + rnd() * 1.2 }); }
const reeds = [];
for (let i = 0; i < 26; i++) { const left = i < 13; reeds.push({ x: left ? rnd() * W * .2 : W - rnd() * W * .2, h: H * (.12 + rnd() * .16),
  ph: rnd() * TAU, w: 2 + rnd() * 2.5, k: 1 + Math.floor(rnd() * 2) }); }
const gusts = [];
for (let i = 0; i < 7; i++) gusts.push({ y: HZ * (.15 + rnd() * .75), s: rnd() * LOOP, len: W * (.18 + rnd() * .2), a: .1 + rnd() * .12 });
const sparks = [];
for (let i = 0; i < 90; i++) sparks.push({ y: rnd(), x: rnd() * 2 - 1, f: 1 + Math.floor(rnd() * 4), ph: rnd() * TAU });

// ---------- logo TIM (viewBox 200) ----------
const RING = new Path2D('M4 100a96 96 0 1 0 192 0a96 96 0 1 0 -192 0Z M11.739 100a88.261 88.261 0 1 0 176.522 0a88.261 88.261 0 1 0 -176.522 0Z');
const GLY = new Path2D('M102.391 112.877L97.609 112.877L97.609 87.123L102.391 87.123L102.391 112.877Z M73.156 112.877L68.373 112.877L68.373 91.170L59.837 91.170L59.837 87.123L81.692 87.123L81.692 91.170L73.156 91.170L73.156 112.877Z M122.871 112.877L118.308 112.877L118.308 87.123L122.245 87.123L133.503 105.923L131.443 105.923L142.517 87.123L146.454 87.123L146.491 112.877L141.966 112.877L141.929 94.224L142.885 94.224L133.467 109.934L131.333 109.934L121.767 94.224L122.871 94.224L122.871 112.877Z M102.391 71.206L97.609 71.206L97.609 49.499L89.073 49.499L89.073 45.452L110.927 45.452L110.927 49.499L102.391 49.499L102.391 71.206Z M90.471 154.548L85.909 154.548L85.909 128.794L89.845 128.794L101.104 147.595L99.043 147.595L110.118 128.794L114.054 128.794L114.091 154.548L109.566 154.548L109.529 135.895L110.486 135.895L101.067 151.605L98.933 151.605L89.367 135.895L90.471 135.895L90.471 154.548Z');

function sky() {
  const g = ctx.createLinearGradient(0, 0, 0, HZ);
  g.addColorStop(0, '#12061f'); g.addColorStop(.38, '#2e0b45'); g.addColorStop(.7, '#6b1a6e'); g.addColorStop(.9, '#c45a8e'); g.addColorStop(1, '#f2b48f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ + 1);
}
function rainbow(p) {
  const cx = W * (O === 'h' ? .2 : .1), R = O === 'h' ? W * .42 : W * .7;
  const cols = ['#ff6b6b', '#ffb36b', '#ffe58a', '#8fe39a', '#7ec8ff', '#a98bff', '#d28bff'];
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, HZ); ctx.clip();
  ctx.globalAlpha = .13 + .03 * Math.sin(TAU * p); ctx.filter = 'blur(6px)';
  cols.forEach((c, i) => { ctx.strokeStyle = c; ctx.lineWidth = 9; ctx.beginPath(); ctx.arc(cx, HZ + R * .12, R - i * 9, Math.PI, TAU); ctx.stroke(); });
  ctx.restore();
}
function sun(p) {
  // quầng sáng
  let g = ctx.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, H * .62);
  g.addColorStop(0, 'rgba(255,240,205,.85)'); g.addColorStop(.12, 'rgba(255,200,160,.45)'); g.addColorStop(.4, 'rgba(214,110,170,.16)'); g.addColorStop(1, 'rgba(120,30,120,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ);
  // tia nắng xoay chậm (xoay đúng 1 bước tia mỗi vòng lặp)
  const N = 18, rot = (TAU / N) * p;
  ctx.save(); ctx.translate(SUN.x, SUN.y); ctx.rotate(rot); ctx.globalCompositeOperation = 'lighter'; ctx.filter = 'blur(5px)';
  for (let i = 0; i < N; i++) {
    const a = i * TAU / N, len = H * (.55 + .25 * ((i * 7) % 5) / 5), wd = .035 + .02 * ((i * 3) % 4) / 4;
    const rg = ctx.createRadialGradient(0, 0, SUN.r, 0, 0, len);
    rg.addColorStop(0, `rgba(255,230,190,${.075 + .03 * Math.sin(TAU * p * 2 + i)})`); rg.addColorStop(1, 'rgba(255,200,170,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, len, a - wd, a + wd); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // đĩa mặt trời
  g = ctx.createRadialGradient(SUN.x - SUN.r * .3, SUN.y - SUN.r * .3, 0, SUN.x, SUN.y, SUN.r);
  g.addColorStop(0, '#fffaf0'); g.addColorStop(.6, '#ffe7b8'); g.addColorStop(1, '#f6c98a');
  ctx.save(); ctx.shadowColor = 'rgba(255,220,170,.9)'; ctx.shadowBlur = 60; ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(SUN.x, SUN.y, SUN.r, 0, TAU); ctx.fill(); ctx.restore();
}
function cloudLayer(p) {
  ctx.save(); ctx.filter = 'blur(18px)';
  for (const c of clouds) {
    const span = W + c.w * 2, x = ((c.x * span + c.n * span * p) % span) - c.w;
    const g = ctx.createRadialGradient(x, c.y, 0, x, c.y, c.w * .5);
    g.addColorStop(0, `rgba(236,190,230,${c.a})`); g.addColorStop(1, 'rgba(236,190,230,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, c.y, c.w * .5, c.h, 0, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function shore() {
  // dải bờ xa + hàng cây, nhà chòi canh ao
  ctx.fillStyle = '#2a0c37';
  ctx.beginPath(); ctx.moveTo(0, HZ);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, HZ - 10 - 14 * Math.sin(x * .004) - 8 * Math.sin(x * .013 + 1) - (x > W * .05 && x < W * .3 ? 18 * Math.sin((x - W * .05) / (W * .25) * Math.PI) : 0));
  ctx.lineTo(W, HZ); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1f0a2b';
  const hx = W * .82, hw = O === 'h' ? 70 : 60;                  // chòi canh
  ctx.fillRect(hx, HZ - 34, hw, 22); ctx.beginPath(); ctx.moveTo(hx - 10, HZ - 34); ctx.lineTo(hx + hw / 2, HZ - 58); ctx.lineTo(hx + hw + 10, HZ - 34); ctx.fill();
  for (let i = 0; i < 4; i++) ctx.fillRect(hx + 6 + i * (hw - 12) / 3, HZ - 14, 3, 16);
}
function water(p) {
  const g = ctx.createLinearGradient(0, HZ, 0, H);
  g.addColorStop(0, '#b45a8c'); g.addColorStop(.12, '#6d2369'); g.addColorStop(.5, '#2c0b3d'); g.addColorStop(1, '#10051c');
  ctx.fillStyle = g; ctx.fillRect(0, HZ, W, H - HZ);
  const cg = ctx.createRadialGradient(SUN.x, HZ, 0, SUN.x, HZ, (H - HZ) * .9);
  cg.addColorStop(0, 'rgba(255,215,180,.45)'); cg.addColorStop(.3, 'rgba(230,140,180,.15)'); cg.addColorStop(1, 'rgba(120,30,120,0)');
  ctx.save(); ctx.translate(SUN.x, HZ); ctx.scale(.45, 1); ctx.translate(-SUN.x, -HZ); ctx.fillStyle = cg; ctx.fillRect(0, HZ, W * 3, H - HZ); ctx.restore();
  // dải phản chiếu mặt trời lấp lánh
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const s of sparks) {
    const d = s.y, y = HZ + 4 + Math.pow(d, 1.6) * (H - HZ);
    const spread = 12 + d * W * .14, x = SUN.x + s.x * spread;
    const fl = .5 + .5 * Math.sin(TAU * s.f * p + s.ph);
    ctx.fillStyle = `rgba(255,228,190,${(.55 - d * .35) * fl})`;
    ctx.fillRect(x - (8 + d * 50) / 2, y, 8 + d * 50, 1 + d * 2.4);
  }
  ctx.restore();
  // sóng gió: các vệt sóng ngang theo phối cảnh
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 34; i++) {
    const d = i / 34, y0 = HZ + 6 + Math.pow(d, 1.7) * (H - HZ);
    ctx.strokeStyle = `rgba(230,170,230,${.05 + d * .07})`; ctx.lineWidth = .6 + d * 1.6; ctx.beginPath();
    for (let x = 0; x <= W; x += 10) {
      const y = y0 + Math.sin(x * (.012 / (.3 + d)) + TAU * p * 2 + i * 1.7) * (1 + d * 5);
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
  // gợn mưa
  for (const r of ripples) {
    const age = ((p * LOOP - r.s) % LOOP + LOOP) % LOOP; if (age > r.life) continue;
    const k = age / r.life, y = HZ + 10 + Math.pow(r.d, 1.5) * (H - HZ - 10), sc = .25 + r.d * 1.2;
    ctx.strokeStyle = `rgba(245,215,250,${(1 - k) * .5})`; ctx.lineWidth = 1 + r.d;
    for (const m of [1, .6]) { ctx.beginPath(); ctx.ellipse(r.x, y, 34 * sc * k * m + 1, 8 * sc * k * m + .5, 0, 0, TAU); ctx.stroke(); }
  }
}
function rainLayer(p, layer) {
  ctx.save(); ctx.lineCap = 'round';
  for (const d of rain) {
    if (d.L !== layer) continue;
    const span = H + d.len, y = ((d.y + d.k * p) % 1) * span - d.len;
    const x = d.x - y * WIND - H * WIND * .1;
    ctx.strokeStyle = `rgba(250,230,255,${d.a})`; ctx.lineWidth = d.w;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - d.len * WIND, y + d.len); ctx.stroke();
  }
  ctx.restore();
}
function windGusts(p) {
  ctx.save(); ctx.lineCap = 'round';
  for (const g of gusts) {
    const age = ((p * LOOP - g.s) % LOOP + LOOP) % LOOP, life = 2.6; if (age > life) continue;
    const k = age / life, x = lerp(-g.len, W + g.len, k), a = Math.sin(Math.PI * k) * g.a;
    const gr = ctx.createLinearGradient(x - g.len, 0, x, 0);
    gr.addColorStop(0, 'rgba(255,240,250,0)'); gr.addColorStop(1, `rgba(255,240,250,${a})`);
    ctx.strokeStyle = gr; ctx.lineWidth = 1.4; ctx.beginPath();
    for (let i = 0; i <= 20; i++) { const xx = x - g.len + g.len * i / 20; const yy = g.y + Math.sin(i * .5 + k * 6) * 6; i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
    ctx.stroke();
  }
  ctx.restore();
}
function reedLayer(p) {
  ctx.save(); ctx.fillStyle = '#0c0414'; ctx.strokeStyle = '#0c0414';
  for (const r of reeds) {
    const sway = Math.sin(TAU * r.k * p + r.ph) * .08 + .14;       // gió đẩy cỏ lau nghiêng
    ctx.lineWidth = r.w; ctx.beginPath(); ctx.moveTo(r.x, H + 5);
    const tx = r.x + r.h * sway * 1.6, ty = H - r.h;
    ctx.quadraticCurveTo(r.x + r.h * sway * .3, H - r.h * .5, tx, ty); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(tx, ty, r.w * 1.6, r.w * 7, sway * 1.4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
const lerp = (a, b, k) => a + (b - a) * k;
function logo() {
  const isH = O === 'h', size = isH ? 168 : 260;
  const title = 'THỦY SẢN ', gold = 'TÍM', tag = 'TINH HOA SINH HỌC · VỮNG VÀNG MÙA VỤ';
  const fs = isH ? 78 : 92, tfs = isH ? 20 : 28;
  ctx.font = `600 ${fs}px MS`; ctx.letterSpacing = '0.06em';
  const tw = ctx.measureText(title + gold).width;
  let lx, ly, tx, ty;
  if (isH) { const gap = 42, total = size + gap + tw; lx = (W - total) / 2; ly = H * .236 - size / 2; tx = lx + size + gap; ty = H * .236 - 6; }
  else { lx = (W - size) / 2; ly = H * .09; tx = (W - tw) / 2; ty = ly + size + 68 + fs * .8; }
  ctx.save(); ctx.shadowColor = 'rgba(20,0,30,.5)'; ctx.shadowBlur = 30;
  ctx.translate(lx, ly); ctx.scale(size / 200, size / 200); ctx.fillStyle = '#fff'; ctx.fill(RING, 'evenodd'); ctx.fill(GLY); ctx.restore();
  ctx.save(); ctx.shadowColor = 'rgba(20,0,30,.55)'; ctx.shadowBlur = 24; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#fff'; ctx.fillText(title, tx, ty);
  const gw = ctx.measureText(title).width, gg = ctx.createLinearGradient(tx + gw, ty - fs, tx + tw, ty);
  gg.addColorStop(0, '#f6e7bd'); gg.addColorStop(.5, '#e2c27c'); gg.addColorStop(1, '#c49a4e');
  ctx.fillStyle = gg; ctx.fillText(gold, tx + gw, ty);
  ctx.font = `500 ${tfs}px MS`; ctx.letterSpacing = '0.236em'; ctx.fillStyle = 'rgba(250,235,255,.92)';
  const tg = ctx.measureText(tag).width;
  if (isH) ctx.fillText(tag, tx, ty + 26 + tfs * 1.618);
  else { const [a, b] = tag.split(' · '); for (const [i, s] of [a, b].entries()) { const w = ctx.measureText(s).width; ctx.fillText(s, (W - w) / 2, ty + 42 + tfs * 1.618 * (i + 1.2)); } }
  // vạch vàng
  const ry = ty + (isH ? 22 : 34), rw = isH ? tw : tw * .382, rx = isH ? tx : (W - rw) / 2;
  const rg = ctx.createLinearGradient(rx, 0, rx + rw, 0);
  rg.addColorStop(0, 'rgba(216,180,108,0)'); rg.addColorStop(.5, '#f6e7bd'); rg.addColorStop(1, 'rgba(216,180,108,0)');
  ctx.shadowBlur = 0; ctx.fillStyle = rg; ctx.fillRect(rx, ry, rw, 2);
  ctx.restore();
}

window.renderAt = function (t) {
  const p = (t % LOOP) / LOOP;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  sky(); rainbow(p); sun(p); cloudLayer(p); rainLayer(p, 0); shore(); water(p); windGusts(p);
  rainLayer(p, 1); reedLayer(p); rainLayer(p, 2);
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  v.addColorStop(0, 'rgba(8,2,14,0)'); v.addColorStop(1, 'rgba(8,2,14,.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (SHOW_LOGO) logo();
};
window.ready = Promise.all([document.fonts.load('600 40px MS'), document.fonts.load('500 20px MS')]).then(() => { renderAt(0); return { W, H, DUR: LOOP }; });
if (Q.get('play') === '1') window.ready.then(() => { const t0 = performance.now(); (function f() { renderAt((performance.now() - t0) / 1000); requestAnimationFrame(f); })(); });
</script>
</body>
</html>
