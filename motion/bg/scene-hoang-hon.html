<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thủy Sản Tím — Background hoàng hôn, cầu vồng</title>
<style>
  @font-face { font-family: MS; font-weight: 500; src: url(../logo/fonts/Montserrat-500.ttf); }
  @font-face { font-family: MS; font-weight: 600; src: url(../logo/fonts/Montserrat-600.ttf); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Bản hoàng hôn (không mưa): chiều tà trên vùng ao nuôi, cùng bố cục mặt trời – tia nắng – cầu vồng của bản sáng.
   Gốc từ bản sáng: Trời xanh, nắng vàng, cầu vồng rõ,
   mây trắng trôi, mưa bóng mây thưa dần, quạt nước quay sủi bọt, cò trắng bay, cỏ xanh lay theo gió.
   Mọi chuyển động tuần hoàn theo LOOP giây → video lặp liền mạch.
   Bố cục φ: chân trời ở 61.8% chiều cao, mặt trời ở 61.8% chiều ngang và 23.6% chiều cao,
   tâm cầu vồng ở 38.2% chiều ngang. */
const PHI = 1.618034, TAU = Math.PI * 2;
const Q = new URLSearchParams(location.search);
const O = Q.get('o') === 'v' ? 'v' : 'h';
const W = O === 'h' ? 1920 : 1080, H = O === 'h' ? 1080 : 1920;
const LOOP = 10, SHOW_LOGO = Q.get('logo') !== '0';
const cv = document.getElementById('c'); let ctx = cv.getContext('2d');
const DPR = +(Q.get('dpr') || 1);
cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';

let seed = 2718; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const isH = O === 'h';
const HZ = H * (isH ? .618 : .6);
const SUN = { x: W * (isH ? .764 : .72), y: HZ - H * (isH ? .146 : .1), r: isH ? 58 : 64 };
const BOW = { x: W * (isH ? .236 : .3), y: HZ + H * .03, R: isH ? W * .236 : W * .42, w: isH ? 12 : 13 };
const WIND = .18;
const lerp = (a, b, k) => a + (b - a) * k;
// lớp vẽ sẵn (offscreen) cho các phần tĩnh hoặc chỉ dịch chuyển: tránh blur mỗi khung → render nhanh
function sprite(w, h, draw) { const c = document.createElement('canvas'); c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR); const x = c.getContext('2d'); x.scale(DPR, DPR); draw(x); return c; }
const wrap = (v, m) => ((v % m) + m) % m;

// ---------- dữ liệu cố định ----------
const rain = [];
for (let i = 0; i < 130; i++) rain.push({ x: rnd() * W * .5, y: rnd(), k: 3 + Math.floor(rnd() * 3), len: 18 + rnd() * 26, a: .22 + rnd() * .3, w: .8 + rnd() * .9 });
const clouds = [];
for (let i = 0; i < 7; i++) {
  const puffs = []; const n = 5 + Math.floor(rnd() * 4);
  for (let j = 0; j < n; j++) puffs.push({ dx: (j / (n - 1) - .5) * 2, dy: -Math.sin(Math.PI * j / (n - 1)) * (.35 + rnd() * .35), r: .32 + rnd() * .26 });
  clouds.push({ y: HZ * (.1 + rnd() * .55), s: (isH ? 90 : 70) + rnd() * 110, x: rnd(), n: 1, a: .75 + rnd() * .25, puffs });
}
const sparks = [];
for (let i = 0; i < 120; i++) sparks.push({ y: rnd(), x: rnd() * 2 - 1, f: 1 + Math.floor(rnd() * 4), ph: rnd() * TAU });
const ripples = [];
for (let i = 0; i < 26; i++) ripples.push({ x: rnd() * W * .6, d: rnd(), s: rnd() * LOOP, life: 1.4 + rnd() });
const grass = [];
for (let i = 0; i < 70; i++) { const left = i < 35; grass.push({ x: left ? rnd() * W * .26 : W - rnd() * W * .26, h: H * (.07 + rnd() * .13), ph: rnd() * TAU, w: 2 + rnd() * 3, k: 1 + Math.floor(rnd() * 2), c: rnd() }); }
const birds = [];
for (let i = 0; i < 3; i++) birds.push({ y: HZ * (.32 + i * .1), s: i * .31, sz: (isH ? 16 : 20) * (1 - i * .18), flap: 2 + i });
const palms = [];
for (let i = 0; i < 7; i++) palms.push({ x: W * (.04 + rnd() * .34), h: 46 + rnd() * 38, lean: (rnd() - .5) * .4, ph: rnd() * TAU });

// ---------- logo TIM (viewBox 200) ----------
const RING = new Path2D('M4 100a96 96 0 1 0 192 0a96 96 0 1 0 -192 0Z M11.739 100a88.261 88.261 0 1 0 176.522 0a88.261 88.261 0 1 0 -176.522 0Z');
const GLY = new Path2D('M102.391 112.877L97.609 112.877L97.609 87.123L102.391 87.123L102.391 112.877Z M73.156 112.877L68.373 112.877L68.373 91.170L59.837 91.170L59.837 87.123L81.692 87.123L81.692 91.170L73.156 91.170L73.156 112.877Z M122.871 112.877L118.308 112.877L118.308 87.123L122.245 87.123L133.503 105.923L131.443 105.923L142.517 87.123L146.454 87.123L146.491 112.877L141.966 112.877L141.929 94.224L142.885 94.224L133.467 109.934L131.333 109.934L121.767 94.224L122.871 94.224L122.871 112.877Z M102.391 71.206L97.609 71.206L97.609 49.499L89.073 49.499L89.073 45.452L110.927 45.452L110.927 49.499L102.391 49.499L102.391 71.206Z M90.471 154.548L85.909 154.548L85.909 128.794L89.845 128.794L101.104 147.595L99.043 147.595L110.118 128.794L114.054 128.794L114.091 154.548L109.566 154.548L109.529 135.895L110.486 135.895L101.067 151.605L98.933 151.605L89.367 135.895L90.471 135.895L90.471 154.548Z');

function sky(ctx) {
  const g = ctx.createLinearGradient(0, 0, 0, HZ);
  g.addColorStop(0, '#2a0f52'); g.addColorStop(.3, '#5b1d77'); g.addColorStop(.55, '#a8367f'); g.addColorStop(.75, '#e9637a'); g.addColorStop(.9, '#ffa65e'); g.addColorStop(1, '#ffd38a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ + 1);
  // ánh hồng tím rất nhẹ gần chân trời (màu thương hiệu)
  const t = ctx.createLinearGradient(0, HZ * .7, 0, HZ);
  t.addColorStop(0, 'rgba(255,200,140,0)'); t.addColorStop(1, 'rgba(255,214,150,.35)');
  ctx.fillStyle = t; ctx.fillRect(0, HZ * .7, W, HZ * .3 + 1);
}
let SUN_GLOW, SUN_RAYS;
function sunSprites() {
  SUN_GLOW = sprite(W, HZ, (ctx) => {
    const g = ctx.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, H * .7);
    g.addColorStop(0, 'rgba(255,246,214,1)'); g.addColorStop(.08, 'rgba(255,206,140,.75)'); g.addColorStop(.3, 'rgba(255,150,110,.24)'); g.addColorStop(1, 'rgba(255,120,110,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ);
    ctx.shadowColor = 'rgba(255,190,120,1)'; ctx.shadowBlur = 90; ctx.fillStyle = '#fff1d0';
    ctx.beginPath(); ctx.arc(SUN.x, SUN.y, SUN.r, 0, TAU); ctx.fill();
  });
  const L = H * .8;
  SUN_RAYS = sprite(L * 2, L * 2, (ctx) => {
    const N = 16; ctx.translate(L, L); ctx.filter = 'blur(4px)';
    for (let i = 0; i < N; i++) {
      const a = i * TAU / N, len = H * (.5 + .25 * ((i * 7) % 5) / 5), wd = .03 + .02 * ((i * 3) % 4) / 4;
      const rg = ctx.createRadialGradient(0, 0, SUN.r, 0, 0, len);
      rg.addColorStop(0, `rgba(255,214,160,${.14 + .05 * Math.sin(i)})`); rg.addColorStop(1, 'rgba(255,190,140,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, len, a - wd, a + wd); ctx.closePath(); ctx.fill();
    }
  });
  SUN_RAYS.L = L;
}
function sun(p) {
  const L = SUN_RAYS.L;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, HZ); ctx.clip();
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .85 + .15 * Math.sin(TAU * p * 2);
  ctx.translate(SUN.x, SUN.y); ctx.rotate((TAU / 16) * p); ctx.drawImage(SUN_RAYS, -L, -L, L * 2, L * 2);
  ctx.restore();
  ctx.drawImage(SUN_GLOW, 0, 0, W, HZ);
}
function sunOld(p) {
  let g = ctx.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, H * .7);
  g.addColorStop(0, 'rgba(255,253,235,1)'); g.addColorStop(.08, 'rgba(255,244,200,.75)'); g.addColorStop(.3, 'rgba(255,236,190,.22)'); g.addColorStop(1, 'rgba(255,236,190,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ);
  const N = 16, rot = (TAU / N) * p;
  ctx.save(); ctx.translate(SUN.x, SUN.y); ctx.rotate(rot); ctx.globalCompositeOperation = 'lighter'; ctx.filter = 'blur(4px)';
  for (let i = 0; i < N; i++) {
    const a = i * TAU / N, len = H * (.5 + .25 * ((i * 7) % 5) / 5), wd = .03 + .02 * ((i * 3) % 4) / 4;
    const rg = ctx.createRadialGradient(0, 0, SUN.r, 0, 0, len);
    rg.addColorStop(0, `rgba(255,250,215,${.13 + .05 * Math.sin(TAU * p * 2 + i)})`); rg.addColorStop(1, 'rgba(255,250,215,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, len, a - wd, a + wd); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.save(); ctx.shadowColor = 'rgba(255,248,210,1)'; ctx.shadowBlur = 80; ctx.fillStyle = '#fffdf2';
  ctx.beginPath(); ctx.arc(SUN.x, SUN.y, SUN.r, 0, TAU); ctx.fill(); ctx.restore();
}
function rainbow(ctx) {
  const cols = ['#ff3b3b', '#ff8a2a', '#ffd93b', '#3fcf6a', '#2aa7ff', '#4a5cff', '#9b4dff'];
  const shimmer = 1;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, HZ); ctx.clip();
  // quầng sáng bên trong cung (đặc trưng cầu vồng thật)
  const inner = ctx.createRadialGradient(BOW.x, BOW.y, BOW.R * .55, BOW.x, BOW.y, BOW.R - BOW.w * 6);
  inner.addColorStop(0, 'rgba(255,255,255,0)'); inner.addColorStop(1, 'rgba(255,255,255,.16)');
  ctx.fillStyle = inner; ctx.beginPath(); ctx.arc(BOW.x, BOW.y, BOW.R - BOW.w * 6, Math.PI, TAU); ctx.fill();
  ctx.filter = 'blur(3px)'; ctx.globalAlpha = .5 * shimmer;
  cols.forEach((c, i) => { ctx.strokeStyle = c; ctx.lineWidth = BOW.w + 1; ctx.beginPath(); ctx.arc(BOW.x, BOW.y, BOW.R - i * BOW.w, Math.PI, TAU); ctx.stroke(); });
  // cung phụ mờ, thứ tự màu ngược
  ctx.globalAlpha = .2 * shimmer; ctx.filter = 'blur(5px)';
  cols.slice().reverse().forEach((c, i) => { ctx.strokeStyle = c; ctx.lineWidth = BOW.w * .8; ctx.beginPath(); ctx.arc(BOW.x, BOW.y, BOW.R * 1.17 - i * BOW.w * .8, Math.PI, TAU); ctx.stroke(); });
  ctx.restore();
  // chân cầu vồng mờ dần vào hơi nước
  const fade = ctx.createLinearGradient(0, HZ - H * .14, 0, HZ);
  fade.addColorStop(0, 'rgba(255,200,140,0)'); fade.addColorStop(1, 'rgba(255,205,150,.5)');
  ctx.fillStyle = fade; ctx.fillRect(0, HZ - H * .14, W, H * .14 + 1);
}
function cloud(x, y, s, a, puffs) {
  // một khối mây liền: hợp các cụm tròn, đáy phẳng, bóng xanh nhạt phía dưới
  const path = new Path2D();
  for (const pf of puffs) { const r = pf.r * s * 1.3; path.moveTo(x + pf.dx * s + r, y + pf.dy * s); path.arc(x + pf.dx * s, y + pf.dy * s, r, 0, TAU); }
  path.rect(x - s * .8, y - s * .05, s * 1.6, s * .3);
  ctx.save(); ctx.filter = `blur(${Math.round(s * .06)}px)`; ctx.globalAlpha = a;
  ctx.fillStyle = '#ffd9c7'; ctx.fill(path);
  ctx.clip(path); const g = ctx.createLinearGradient(0, y - s * .6, 0, y + s * .3);
  g.addColorStop(0, 'rgba(255,236,200,.35)'); g.addColorStop(.55, 'rgba(232,120,140,.35)'); g.addColorStop(1, 'rgba(120,50,120,.75)');
  ctx.fillStyle = g; ctx.fillRect(x - s * 2, y - s, s * 4, s * 1.4);
  ctx.restore();
}
function cloudSprites() {
  for (const c of clouds) { const s = c.s * .8, w = s * 4.4, h = s * 3.2; c.img = sprite(w, h, (x) => { const o = ctx; ctx = x; cloud(w / 2, h * .6, s, c.a, c.puffs); ctx = o; }); c.w = w; c.h = h; }
}
function cloudLayer(p) {
  for (const c of clouds) {
    const span = W + c.s * 6, x = wrap(c.x * span + c.n * span * p, span) - c.s * 3;
    ctx.drawImage(c.img, x - c.w / 2, c.y - c.h * .6, c.w, c.h);
  }
}
function rainLayer(p) {
  // mưa bóng mây: chỉ phía trái, thưa dần về phía mặt trời, hạt mưa ánh nắng
  ctx.save(); ctx.lineCap = 'round';
  for (const d of rain) {
    const span = HZ + d.len, y = ((d.y + d.k * p) % 1) * span - d.len;
    const x = d.x - y * WIND; const fadeX = 1 - Math.min(1, d.x / (W * .5));
    ctx.strokeStyle = `rgba(255,255,255,${d.a * (.4 + .6 * fadeX)})`; ctx.lineWidth = d.w;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - d.len * WIND, y + d.len); ctx.stroke();
  }
  ctx.restore();
}
function palm(x, base, h, lean, ph, p) {
  const sway = Math.sin(TAU * p + ph) * .05;
  ctx.strokeStyle = '#2a1430'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, base);
  const tx = x + h * (lean + sway), ty = base - h; ctx.quadraticCurveTo(x + h * lean * .3, base - h * .55, tx, ty); ctx.stroke();
  ctx.fillStyle = '#2a1430';
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (i - 3) * .48 + sway * 3; ctx.save(); ctx.translate(tx, ty); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(h * .22, -h * .06, h * .36, h * .1); ctx.quadraticCurveTo(h * .2, h * .02, 0, 0); ctx.fill(); ctx.restore();
  }
}
function shore(p) {
  // dải bờ xa xanh lá, rặng dừa, chòi canh ao
  const g = ctx.createLinearGradient(0, HZ - 40, 0, HZ);
  g.addColorStop(0, '#4a2a4f'); g.addColorStop(1, '#2e1838');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, HZ);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, HZ - 8 - 8 * Math.sin(x * .004) - 5 * Math.sin(x * .013 + 1));
  ctx.lineTo(W, HZ); ctx.closePath(); ctx.fill();
  for (const pl of palms) palm(pl.x, HZ - 10, pl.h * (isH ? 1 : 1.2), pl.lean, pl.ph, p);
  const hx = W * (isH ? .86 : .78), hw = isH ? 64 : 58, base = HZ - 8;
  ctx.fillStyle = '#3a2030'; ctx.fillRect(hx, base - 26, hw, 20);
  ctx.fillStyle = '#26122a'; ctx.beginPath(); ctx.moveTo(hx - 10, base - 26); ctx.lineTo(hx + hw / 2, base - 48); ctx.lineTo(hx + hw + 10, base - 26); ctx.fill();
  ctx.fillStyle = '#26122a'; for (let i = 0; i < 4; i++) ctx.fillRect(hx + 6 + i * (hw - 12) / 3, base - 7, 3, 10);
  // bờ ao giữa (đê ao) chạy chéo, viền ánh nắng
  ctx.fillStyle = '#3a2040'; ctx.beginPath();
  const y1 = HZ + (H - HZ) * .07;
  ctx.moveTo(W * .5, y1 - 3); ctx.lineTo(W, y1 - 10); ctx.lineTo(W, y1 + 4); ctx.lineTo(W * .5, y1 + 5); ctx.closePath(); ctx.fill();
}
function water(p) {
  const g = ctx.createLinearGradient(0, HZ, 0, H);
  g.addColorStop(0, '#ffc98a'); g.addColorStop(.1, '#e0727e'); g.addColorStop(.5, '#6a2a72'); g.addColorStop(1, '#2a0f40');
  ctx.fillStyle = g; ctx.fillRect(0, HZ, W, H - HZ);
  // phản chiếu cầu vồng trên mặt nước (mờ, lay nhẹ theo sóng)
  ctx.save(); ctx.globalAlpha = .9 + .1 * Math.sin(TAU * p * 2); ctx.drawImage(REFLECT, 0, HZ + Math.sin(TAU * p) * 2, W, H - HZ); ctx.restore();
  // vệt nắng lấp lánh dưới mặt trời
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const s of sparks) {
    const d = s.y, y = HZ + 4 + Math.pow(d, 1.5) * (H - HZ);
    const spread = 18 + d * W * .16, x = SUN.x + s.x * spread;
    const fl = .5 + .5 * Math.sin(TAU * s.f * p + s.ph);
    ctx.fillStyle = `rgba(255,222,160,${(.8 - d * .45) * fl})`;
    ctx.fillRect(x - (8 + d * 56) / 2, y, 8 + d * 56, 1 + d * 2.6);
  }
  ctx.restore();
  // sóng gợn theo phối cảnh
  ctx.save();
  for (let i = 0; i < 34; i++) {
    const d = i / 34, y0 = HZ + 6 + Math.pow(d, 1.7) * (H - HZ);
    ctx.strokeStyle = `rgba(255,190,170,${.08 + d * .1})`; ctx.lineWidth = .6 + d * 1.6; ctx.beginPath();
    for (let x = 0; x <= W; x += 10) { const y = y0 + Math.sin(x * (.012 / (.3 + d)) + TAU * p * 2 + i * 1.7) * (1 + d * 5); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  ctx.restore();
  for (const r of []) {
    const age = wrap(p * LOOP - r.s, LOOP); if (age > r.life) continue;
    const k = age / r.life, y = HZ + 10 + Math.pow(r.d, 1.5) * (H - HZ - 10), sc = .25 + r.d * 1.2;
    ctx.strokeStyle = `rgba(255,255,255,${(1 - k) * .55})`; ctx.lineWidth = 1 + r.d;
    for (const m of [1, .6]) { ctx.beginPath(); ctx.ellipse(r.x, y, 34 * sc * k * m + 1, 8 * sc * k * m + .5, 0, 0, TAU); ctx.stroke(); }
  }
}
function aerator(p, cx, cy, sc) {
  // giàn quạt nước: phao, trục và 4 cánh quạt quay, bọt trắng sủi phía sau
  const units = 4, gap = 44 * sc;
  for (let u = 0; u < units; u++) {
    const x = cx + (u - (units - 1) / 2) * gap;
    // bọt sóng trắng (vệt kéo dài phía trước quạt)
    for (let k = 0; k < 9; k++) {
      const ph = wrap(p * 4 + k / 9 + u * .21, 1), fx = x + (k - 4) * 3 * sc, fy = cy + 6 * sc + ph * 46 * sc;
      ctx.fillStyle = `rgba(255,226,210,${(1 - ph) * .55})`; ctx.beginPath(); ctx.ellipse(fx, fy, (6 + ph * 14) * sc, (2 + ph * 4) * sc, 0, 0, TAU); ctx.fill();
    }
    ctx.filter = 'none';
    // cánh quạt
    ctx.save(); ctx.translate(x, cy); const a = TAU * p * 6;
    for (let b = 0; b < 6; b++) {
      const ang = a + b * TAU / 6, s = Math.sin(ang), c = Math.cos(ang);
      ctx.fillStyle = s > 0 ? '#3a1d48' : '#5a2d63';
      ctx.fillRect(-12 * sc, -s * 12 * sc - 2 * sc, 24 * sc, (4 + Math.abs(c) * 3) * sc);
    }
    ctx.restore();
    // phao xanh
    ctx.fillStyle = '#2a1436'; ctx.beginPath(); ctx.ellipse(x - 17 * sc, cy + 2 * sc, 5 * sc, 7 * sc, 0, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#c9a9b8'; ctx.lineWidth = 3 * sc; ctx.beginPath(); ctx.moveTo(cx - (units / 2) * gap, cy); ctx.lineTo(cx + (units / 2) * gap, cy); ctx.stroke();
  ctx.fillStyle = '#d8b8c0'; ctx.fillRect(cx + (units / 2) * gap - 4 * sc, cy - 10 * sc, 18 * sc, 14 * sc); // mô tơ
}
function birdLayer(p) {
  ctx.save(); ctx.strokeStyle = '#2a1030'; ctx.lineCap = 'round';
  for (const b of birds) {
    const k = wrap(p + b.s, 1), x = lerp(-W * .1, W * 1.1, k), y = b.y + Math.sin(TAU * k * 2) * 10;
    const f = Math.sin(TAU * p * b.flap * 2) * .6;
    ctx.lineWidth = 2.6; ctx.beginPath();
    ctx.moveTo(x - b.sz, y - b.sz * f); ctx.quadraticCurveTo(x - b.sz * .4, y - b.sz * .25, x, y); ctx.quadraticCurveTo(x + b.sz * .4, y - b.sz * .25, x + b.sz, y - b.sz * f);
    ctx.stroke();
  }
  ctx.restore();
}
function grassLayer(p) {
  ctx.save(); ctx.lineCap = 'round';
  for (const r of grass) {
    const sway = Math.sin(TAU * r.k * p + r.ph) * .07 + .08;
    ctx.strokeStyle = r.c < .5 ? '#1e0c24' : (r.c < .8 ? '#2c1434' : '#3b1d40'); ctx.lineWidth = r.w; ctx.beginPath(); ctx.moveTo(r.x, H + 5);
    ctx.quadraticCurveTo(r.x + r.h * sway * .3, H - r.h * .5, r.x + r.h * sway * 1.6, H - r.h); ctx.stroke();
  }
  ctx.restore();
}
function logo() {
  const size = isH ? 150 : 240;
  const title = 'THỦY SẢN ', gold = 'TÍM', tag = 'TINH HOA SINH HỌC · VỮNG VÀNG MÙA VỤ';
  const fs = isH ? 70 : 86, tfs = isH ? 18 : 26;
  ctx.font = `600 ${fs}px MS`; ctx.letterSpacing = '0.06em';
  const tw = ctx.measureText(title + gold).width;
  let lx, ly, tx, ty;
  if (isH) { const gap = 38, total = size + gap + tw; lx = (W - total) / 2; ly = H * .18 - size / 2; tx = lx + size + gap; ty = H * .18 - 4; }
  else { lx = (W - size) / 2; ly = H * .07; tx = (W - tw) / 2; ty = ly + size + 64 + fs * .8; }
  // nền kính mờ sau logo để chữ tím đọc rõ trên trời sáng
  ctx.save(); ctx.filter = 'blur(50px)'; ctx.fillStyle = 'rgba(30,8,50,.28)';
  if (isH) { ctx.beginPath(); ctx.ellipse(lx + (size + 38 + tw) / 2, H * .18, (size + tw) * .62, size * .8, 0, 0, TAU); ctx.fill(); }
  else { ctx.beginPath(); ctx.ellipse(W / 2, ly + size, W * .46, size * 1.1, 0, 0, TAU); ctx.fill(); }
  ctx.restore();
  const plum = '#ffffff';
  ctx.save(); ctx.shadowColor = 'rgba(30,5,40,.5)'; ctx.shadowBlur = 24; ctx.translate(lx, ly); ctx.scale(size / 200, size / 200); ctx.fillStyle = plum; ctx.fill(RING, 'evenodd'); ctx.fill(GLY); ctx.restore();
  ctx.save(); ctx.textBaseline = 'alphabetic'; ctx.shadowColor = 'rgba(30,5,40,.55)'; ctx.shadowBlur = 22;
  ctx.fillStyle = '#ffffff'; ctx.fillText(title, tx, ty);
  const gw = ctx.measureText(title).width, gg = ctx.createLinearGradient(tx + gw, ty - fs, tx + tw, ty);
  gg.addColorStop(0, '#f6e7bd'); gg.addColorStop(.5, '#e2c27c'); gg.addColorStop(1, '#c49a4e');
  ctx.fillStyle = gg; ctx.fillText(gold, tx + gw, ty);
  ctx.font = `500 ${tfs}px MS`; ctx.letterSpacing = '0.236em'; ctx.fillStyle = 'rgba(255,240,235,.92)';
  if (isH) ctx.fillText(tag, tx, ty + 24 + tfs * 1.618);
  else { const parts = tag.split(' · '); parts.forEach((s, i) => { const w = ctx.measureText(s).width; ctx.fillText(s, (W - w) / 2, ty + 40 + tfs * 1.618 * (i + 1.2)); }); }
  const ry = ty + (isH ? 20 : 32), rw = isH ? tw : tw * .382, rx = isH ? tx : (W - rw) / 2;
  const rg = ctx.createLinearGradient(rx, 0, rx + rw, 0);
  rg.addColorStop(0, 'rgba(216,180,108,0)'); rg.addColorStop(.5, '#f6e7bd'); rg.addColorStop(1, 'rgba(216,180,108,0)');
  ctx.shadowBlur = 0;
  ctx.fillStyle = rg; ctx.fillRect(rx, ry, rw, 2);
  ctx.restore();
}

window.renderAt = function (t) {
  const p = (t % LOOP) / LOOP;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(SKY, 0, 0, W, HZ + 1);
  ctx.save(); ctx.globalAlpha = .88 + .12 * Math.sin(TAU * p); ctx.drawImage(BOW_IMG, 0, 0, W, HZ); ctx.restore();
  cloudLayer(p); sun(p); birdLayer(p); shore(p); water(p);
  aerator(p, W * (isH ? .7 : .66), HZ + (H - HZ) * .2, isH ? 1 : 1.1);
  aerator(p, W * (isH ? .3 : .3), HZ + (H - HZ) * .42, isH ? 1.6 : 1.7);
  grassLayer(p);
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .45, W / 2, H / 2, Math.max(W, H) * .8);
  v.addColorStop(0, 'rgba(20,4,30,0)'); v.addColorStop(1, 'rgba(20,4,30,.4)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (SHOW_LOGO) logo();
};
let SKY, BOW_IMG, REFLECT;
function buildSprites() {
  SKY = sprite(W, HZ + 1, (x) => sky(x));
  BOW_IMG = sprite(W, HZ, (x) => rainbow(x));
  REFLECT = sprite(W, H - HZ, (x) => { x.beginPath(); x.rect(0, 0, W, (H - HZ) * .45); x.clip(); x.translate(0, HZ + H * .02); x.scale(1, -1); x.globalAlpha = .14; x.filter = 'blur(10px)';
    ['#ff3b3b', '#ffd93b', '#3fcf6a', '#2aa7ff', '#9b4dff'].forEach((c, i) => { x.strokeStyle = c; x.lineWidth = BOW.w * 1.5; x.beginPath(); x.arc(BOW.x, BOW.y, BOW.R - i * BOW.w * 1.4, Math.PI, TAU); x.stroke(); }); });
  sunSprites(); cloudSprites();
}
window.ready = Promise.all([document.fonts.load('600 40px MS'), document.fonts.load('500 20px MS')]).then(() => { buildSprites(); renderAt(0); return { W, H, DUR: LOOP }; });
if (Q.get('play') === '1') window.ready.then(() => { const t0 = performance.now(); (function f() { renderAt((performance.now() - t0) / 1000); requestAnimationFrame(f); })(); });
</script>
